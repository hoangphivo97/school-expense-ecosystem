name: Continuous Deployment to Firebase

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_RELEASE_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Install Firebase CLI globally
        run: npm install -g firebase-tools

      - name: Derive appropriate SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Deploy Affected Applications Only
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: yarn nx affected -t deploy --token "${{ secrets.FIREBASE_TOKEN }}"