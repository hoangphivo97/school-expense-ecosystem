<mat-dialog-content>
  <h2 class="dialog-title text-capitalize" mat-dialog-title>{{ data.title }}</h2>

  @if (data.message) {
    <p class="dialog-message text-muted small mb-3">{{ data.message }}</p>
  }

  <mat-form-field class="w-100 mt-2" appearance="outline">
    <mat-label>Reason Description</mat-label>
    <textarea matInput 
              required
              #reasonInput="ngModel"
              [(ngModel)]="reasonText"
              name="reasonText"
              rows="3" 
              (input)="reasonText.set($any($event.target).value)" 
              [placeholder]="data.placeholder || 'Provide concrete justification details...'">
    </textarea>
    
    @if (reasonInput.invalid && (reasonInput.dirty || reasonInput.touched)) {
      <mat-error>Justification reason is strictly mandatory.</mat-error>
    }
  </mat-form-field>

  <mat-dialog-actions class="button-wrap justify-content-end gap-2 px-0 pt-3 border-0">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-flat-button 
            color="primary" 
            [disabled]="!reasonText().trim()" 
            (click)="onSave()">
      Save Change
    </button>
  </mat-dialog-actions>
</mat-dialog-content>
