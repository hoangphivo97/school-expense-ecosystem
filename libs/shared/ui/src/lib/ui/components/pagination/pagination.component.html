<nav class="enterprise-pagination-container" aria-label="Data grid navigation"
  *transloco="let t; read: 'shared.pagination'">

  <!-- Left Side: Page Size Selector Boundary -->
  <div class="page-size-selector">
    <span class="size-label">{{ t('itemsPerPage') }}</span>
    <mat-form-field appearance="outline" class="density-compact">
      <mat-select [value]="pageSize()" (selectionChange)="pageSizeChange.emit($event.value)">
        @for (option of pageSizeOptions(); track option) {
        <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Right Side: Navigation Control Node Pipeline -->
  <div class="page-navigation-controls">
    <button mat-icon-button [disabled]="normalizedCurrentPage() === 0" (click)="selectPage(normalizedCurrentPage() - 1)"
      [aria-label]="t('prevPage')">
      <mat-icon>chevron_left</mat-icon>
    </button>

    <div class="page-numbers-group">
      @for (pageIndex of pageIndices(); track pageIndex) {
      <button mat-flat-button [class.active-page-node]="normalizedCurrentPage() === pageIndex"
        (click)="selectPage(pageIndex)">
        {{ pageIndex + 1 }}
      </button>
      }
    </div>

    <button mat-icon-button [disabled]="normalizedCurrentPage() === totalPages() - 1"
      (click)="selectPage(normalizedCurrentPage() + 1)" [aria-label]="t('nextPage')">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</nav>
