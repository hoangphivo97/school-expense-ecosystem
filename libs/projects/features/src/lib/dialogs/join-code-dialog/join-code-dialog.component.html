<div class="join-code-dialog p-4" *transloco="let t">
  <div class="d-flex align-items-center gap-3 mb-3">
    <mat-icon color="primary" class="fs-4">{{ contextMeta().icon }}</mat-icon>
    <div>
      <h2 class="dialog-title m-0 fs-5 fw-bold">{{ t(contextMeta().translocoKey + '.title') }}</h2>
      <p class="dialog-subtitle text-muted small m-0">{{ t(contextMeta().translocoKey + '.subtitle') }}</p>
    </div>
  </div>

  @if (errorMessage()) {
    <div class="alert alert-danger py-2 px-3 mb-3 small">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="joinForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>{{ t(contextMeta().translocoKey + '.codeLabel') }}</mat-label>
      <mat-icon matIconPrefix class="text-secondary">vpn_key</mat-icon>
      <input
        matInput
        formControlName="code"
        (input)="onCodeInput($event)"
        [placeholder]="t(contextMeta().translocoKey + '.codePlaceholder')"
        class="font-monospace text-uppercase"
        maxlength="12"
      />
    </mat-form-field>

    <mat-dialog-actions align="end" class="gap-2 p-0 mt-3">
      <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting()">
        {{ t('common.cancel') }}
      </button>
      <button mat-flat-button color="primary" type="submit" [disabled]="joinForm.invalid || isSubmitting()">
        <mat-icon *ngIf="isSubmitting()" class="spinning me-1">sync</mat-icon>
        <span>{{ isSubmitting() ? t('common.joining') : t('common.confirm') }}</span>
      </button>
    </mat-dialog-actions>
  </form>
</div>
