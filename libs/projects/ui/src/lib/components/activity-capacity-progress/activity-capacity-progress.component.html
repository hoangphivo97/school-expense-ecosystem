@if (max()) {
  <div class="enrollment-container">
    <div class="d-flex justify-content-between align-items-center mb-1 small">
      <span class="capacity-ratio fw-semibold font-monospace" [class.is-full]="resolvedIsFull()">
        {{ current() }}/{{ max() }}
      </span>
      <span class="capacity-percent smaller">{{ resolvedPercentage() }}%</span>
    </div>

    <div class="progress-track">
      <div
        class="progress-fill"
        [style.width.%]="resolvedPercentage()"
        [ngClass]="{
          'is-full': resolvedIsFull(),
          'is-near-full': resolvedPercentage() >= 80 && !resolvedIsFull(),
          'is-normal': resolvedPercentage() < 80
        }"
      ></div>
    </div>
  </div>
} @else {
  <div
    class="uncapped-container d-flex align-items-center gap-2"
    [matTooltip]="'shared.capacity.unlimited' | transloco"
    matTooltipPosition="above"
  >
    <div class="uncapped-metrics d-flex align-items-center gap-1 font-monospace fw-semibold">
      <mat-icon class="uncapped-icon">{{ fallbackIcon() }}</mat-icon>
      <span class="uncapped-current">{{ current() }}</span>
      <span class="uncapped-divider fw-normal">/</span>
      <span class="uncapped-infinity">∞</span>
    </div>
    <span class="free-badge smaller">Free</span>
  </div>
}
