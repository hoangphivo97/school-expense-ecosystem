@if (max()) {
  <div class="enrollment-container">
    <div class="d-flex justify-content-between align-items-center mb-1 small">
      <span class="fw-semibold font-monospace" [class.text-danger]="resolvedIsFull()">
        {{ current() }}/{{ max() }}
      </span>
      <span class="text-secondary smaller">{{ resolvedPercentage() }}%</span>
    </div>

    <div class="progress-track">
      <div
        class="progress-fill"
        [style.width.%]="resolvedPercentage()"
        [ngClass]="{
          'bg-danger': resolvedIsFull(),
          'bg-warning': resolvedPercentage() >= 80 && !resolvedIsFull(),
          'bg-primary': resolvedPercentage() < 80
        }"
      ></div>
    </div>
  </div>
} @else {
  <!-- Trường hợp không giới hạn (Unlimited capacity) -->
  <div
    class="uncapped-container d-flex align-items-center gap-2"
    [matTooltip]="'shared.capacity.unlimited' | transloco"
    matTooltipPosition="above"
  >
    <div class="d-flex align-items-center gap-1 font-monospace fw-semibold text-secondary">
      <mat-icon class="fs-6 h-auto w-auto text-muted">{{ fallbackIcon() }}</mat-icon>
      <span>{{ current() }}</span>
      <span class="text-muted fw-normal">/</span>
      <span class="fs-6 text-muted">∞</span >
    </div>
    <span class="badge bg-light text-muted border smaller px-1 py-0">Free</span>
  </div>
}
