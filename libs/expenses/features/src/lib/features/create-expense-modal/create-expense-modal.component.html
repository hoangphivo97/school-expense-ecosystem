<div class="modal-container">
  <h2 mat-dialog-title class="fw-bold border-bottom pb-2">
    <mat-icon color="primary" class="vertical-align-middle me-2">
      {{ dialogData.action === Action.Create ? 'add_circle' : 'edit' }}
    </mat-icon>
    {{ dialogData.title }}
  </h2>

  <mat-dialog-content class="pt-3">
    <form [formGroup]="expenseForm" class="container-fluid">
      <div class="row">
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Ngày giao dịch</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="date" readonly>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Hình thức thanh toán</mat-label>
            <mat-select formControlName="paidMethod">
              @for (method of PaidMethods; track method.value) {
                <mat-option [value]="method.value">{{ method.label }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Mục đích</mat-label>
            <input matInput formControlName="purpose" placeholder="Ví dụ: Mua văn phòng phẩm">
            <mat-icon matPrefix class="text-secondary me-2">label</mat-icon>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Số tiền (VND)</mat-label>
            <input matInput 
                   type="text" 
                   (input)="onInputAmount($event)" 
                   [value]="expenseForm.controls.amount.value | number:'1.0-0'"
                   placeholder="0">
            <mat-icon matPrefix class="text-success me-2">payments</mat-icon>
            <mat-hint align="end">Tối thiểu 1,000 VND</mat-hint>
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Mô tả chi tiết</mat-label>
            <textarea matInput 
                      rows="3" 
                      formControlName="description" 
                      placeholder="Nhập chi tiết lý do chi tiêu..."></textarea>
          </mat-form-field>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="border-top pt-2">
    <button mat-button (click)="closeDialog(false)" class="px-4">Hủy bỏ</button>
    <button mat-raised-button 
            color="primary" 
            class="px-4" 
            [disabled]="expenseForm.invalid"
            (click)="onSave()">
      <mat-icon class="me-1">save</mat-icon>
      {{ dialogData.action === Action.Create ? 'Tạo mới' : 'Cập nhật' }}
    </button>
  </mat-dialog-actions>
</div>
