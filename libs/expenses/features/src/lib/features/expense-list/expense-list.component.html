<lib-header></lib-header>
<div class="expense-list">
  <section class="create-section">
    <button data-testid="open-create-modal-btn" class="create-btn" (click)="openCreateExpenseModal()">
      Create New Expense
    </button>
  </section>

  <lib-filter (filterChange)="onFilterChanged($event)" [inputDataSource]="dataSource()" [yearsList]="availableYears()"
    [value]="filterParams()"></lib-filter>

  @if(dataSource().data.length > 0){
  <table mat-table [dataSource]="dataSource()">
    <!--- Note that these columns can be defined in any order.
    The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let element">
        {{ element.date | date: 'dd/MM/yyyy' }}
      </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{ element.description }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="purpose">
      <th mat-header-cell *matHeaderCellDef>Purpose</th>
      <td mat-cell *matCellDef="let element">{{ element.purpose }}</td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="paid">
      <th mat-header-cell *matHeaderCellDef>Paid Method</th>
      <td mat-cell *matCellDef="let element">
        {{ element.paid | enumToString }}
      </td>
    </ng-container>

    <ng-container matColumnDef="for">
      <th mat-header-cell *matHeaderCellDef>For</th>
      <td mat-cell *matCellDef="let element">{{ element.for }}</td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let element">
        {{ element.amount | number: '3.0-0' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn" (click)="openDeleteConfirmModal(element.id, element.description)"
          aria-label="Delete expense">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="openEditExpenseModal(element)" aria-label="Edit expense">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [length]="totalItems()" [pageSize]="pageSize()" [pageIndex]="currentPageIndex()"
    [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange($event)" aria-label="Select page of database users">
  </mat-paginator>
  } @else {
  <ng-container *ngTemplateOutlet="noData"></ng-container>
  }

  <ng-template #noData>
    <div class="no-data">No data available</div>
  </ng-template>

</div>
<lib-footer></lib-footer>
