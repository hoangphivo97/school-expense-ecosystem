<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <mat-card class="p-5 shadow-sm text-center waiting-card border-0">
    <mat-card-content class="d-flex flex-column align-items-center py-4">

      <mat-progress-spinner mode="indeterminate" [diameter]="80" class="mb-4 processing-spinner">
      </mat-progress-spinner>

      <h2 class="text-primary fw-bold mb-3">Verifying Your Application</h2>

      <p class="text-muted text-center px-4 leadfs-6">
        Your onboarding profile data is currently being reviewed by the administration faculty.
        You will be granted access to the ecosystem automatically upon confirmation.
      </p>

      <div class="mt-2 text-secondary small-text d-flex align-items-center gap-1">
        <span class="spinner-grow spinner-grow-sm text-success" role="status"></span>
        Listening for instant validation changes...
      </div>
      <button mat-button color="warn" class="px-4" (click)="handleLogout()">
        Log Out Account
      </button>
    </mat-card-content>
  </mat-card>
</div>
