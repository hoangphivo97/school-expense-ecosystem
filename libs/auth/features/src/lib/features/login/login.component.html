<div class="main">
  <form [formGroup]="loginForm">
    <div class="block">
      <p class="title"><b>Sign in</b></p>
      <div class="form">
        <label for="email">Email address</label>
        <input
          formControlName="email"
          class="username"
          type="email"
          id="email"
          placeholder="your@email.com"
        />
        
        <label for="password">Password</label>
        <input
          formControlName="passWord"
          class="password"
          type="password"
          id="password"
          placeholder="*****"
        />
      </div>
      <div class="remem-group">
        <mat-checkbox class="check">Remember me</mat-checkbox>
      </div>
      <div class="button-group">
        <button 
          type="submit" 
          (click)="loginAction()" 
          [disabled]="loginForm.invalid || loading"
          class="login-action"
        >
          Sign in
        </button>
      </div>
      <button [disabled]="true" class="forgot-btn">
        Forgot your password ?
      </button>
      <div class="seperate">
        <span class="or">or</span>
      </div>
      <button class="google-login-btn" type="button" (click)="loginWithGoogle()">
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          alt="Google Logo"
        />
        Sign in with Google
      </button>
      <div class="sign-up-section">
        <p>Don't have account ? <a class="signup-btn" (click)="openRegisterModal()">Sign up</a></p>
      </div>
    </div>
  </form>
</div>
