<mat-sidenav-container class="sidenav-container">
  
  <!-- Sidebar Panel Navigation Drawer -->
  <mat-sidenav
    mode="side"
    class="app-sidenav"
    [opened]="true"
    [fixedInViewport]="true"
    [class.collapsed]="collapsed"
  >
    <app-sidebar
      [collapsed]="collapsed"
      (toggle)="toggleSidebar()"
      (logout)="logout()"
    ></app-sidebar>
  </mat-sidenav>

  <!-- Dynamic Content Display Viewport Area -->
  <mat-sidenav-content [class.collapsed]="collapsed">
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

<!-- Floating Responsive Action Controller Button -->
<button
  mat-icon-button
  class="collapse-btn"
  [class.collapsed]="collapsed"
  (click)="toggleSidebar()"
>
  <mat-icon class="collapse-icon">{{ toggleIcon }}</mat-icon>
</button>
